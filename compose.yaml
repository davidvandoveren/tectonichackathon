# Production-like local run of the exact image we deploy: `docker compose up --build`
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    # Everything in .env (API keys for Gemini/ElevenLabs, ADMIN_USERNAMES, ...) reaches the app.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
      # No proxy in front locally: rate limit on the socket peer.
      TRUSTED_PROXY_HOPS: "0"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env (see .env.example)}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
